{% extends "admin/index.html" %}

{% block content %}
    {% if aniversariantes_hoje %}
    <div style="background-color: #ffdce5; color: #a90035; padding: 15px; margin-bottom: 20px; border-radius: 5px; border-left: 5px solid #ff1a5f;">
        <h2 style="margin-top: 0; color: #a90035; font-size: 1.5rem; display: flex; align-items: center; gap: 8px;">🎉 Aniversariantes de Hoje!</h2>
        <ul style="margin-bottom: 0; font-size: 1.1rem;">
        {% for cliente in aniversariantes_hoje %}
            <li><strong>{{ cliente.nome }}</strong> - Deseje feliz aniversário: {{ cliente.telefone }}</li>
        {% endfor %}
        </ul>
    </div>
    {% endif %}

    {{ block.super }}
{% endblock %}
